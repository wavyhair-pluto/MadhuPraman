version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: truesource_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sih2026_secure_password
      POSTGRES_DB: truesource
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: truesource_db_admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
